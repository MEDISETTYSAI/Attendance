<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Attendance</title>

    <style>
        body {
            background-color: #f0f4ff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        h2 {
            font-size: 32px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 35px;
            margin: 20px;
            font-size: 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
        }

        .student {
            background-color: #198754;
        }

        .staff {
            background-color: #dc3545;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<h2>Select Attendance Type</h2>

<a href="/students">
    <button class="btn student">Students</button>
</a>

<a href="/staff-login">
    <button class="btn staff">Staff</button>
</a>

</body>
</html>
