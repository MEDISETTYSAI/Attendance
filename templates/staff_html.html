<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <style>
        body { font-family:Arial; text-align:center; margin-top:100px; }
        input {
            padding:10px; font-size:16px;
            margin:8px; width:220px;
        }
        button {
            padding:10px 20px;
            font-size:16px;
            background:#dc3545;
            color:white; border:none;
            border-radius:5px;
        }
    </style>
</head>
<body>

<h3>Admin Login</h3>

<form method="post">
    <input type="text" name="login_id" placeholder="Admin Login ID" required><br>
    <input type="password" name="password" placeholder="Password" required><br>
    <button type="submit">Login</button>
</form>

</body>
</html>
