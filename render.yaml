# Render Blueprint: one web service + one free Postgres database.
# In Render: New -> Blueprint -> pick this repo, it reads this file.

databases:
  - name: attendance-db
    plan: free

services:
  - type: web
    name: attendance
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python attendence_server.py
    envVars:
      # Permanent cloud database (auto-filled from the Postgres above).
      - key: DATABASE_URL
        fromDatabase:
          name: attendance-db
          property: connectionString

      # Real client IP is behind Render's proxy.
      - key: TRUST_PROXY
        value: "1"

      # 🔴 SET THIS AFTER DEPLOY: your office's PUBLIC IP.
      # Open  https://<your-app>.onrender.com/whoami  while on office Wi-Fi
      # and paste the "your_ip" value here (Render dashboard -> Environment).
      - key: OFFICE_NETWORKS
        sync: false

      # Login/session security.
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: BIXBI
      - key: ADMIN_PASSWORD
        sync: false          # set your own admin password in the dashboard

      - key: PYTHON_VERSION
        value: "3.11.9"
