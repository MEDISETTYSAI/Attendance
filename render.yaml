# Render Blueprint: web service only.
# The DATABASE lives on Supabase (free, no expiry) so data is permanent.
# In Render: New -> Blueprint -> pick this repo, it reads this file.

services:
  - type: web
    name: attendance
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python attendence_server.py
    envVars:
      # 🔴 SET THIS: your Supabase connection string (Postgres).
      # Supabase -> Project -> Connect -> "Session pooler" URI. It looks like:
      # postgresql://postgres.xxxx:PASSWORD@aws-0-region.pooler.supabase.com:5432/postgres
      - key: DATABASE_URL
        sync: false

      # Real client IP is behind Render's proxy.
      - key: TRUST_PROXY
        value: "1"

      # 🔴 SET THIS AFTER DEPLOY: your office's PUBLIC IP.
      # Open  https://<your-app>.onrender.com/whoami  while on office Wi-Fi
      # and paste the "your_ip" value here.
      - key: OFFICE_NETWORKS
        sync: false

      # Login/session security.
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: BIXBI
      - key: ADMIN_PASSWORD
        sync: false          # set your own admin password

      - key: PYTHON_VERSION
        value: "3.11.9"
